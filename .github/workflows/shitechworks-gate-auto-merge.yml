# Fail-closed site merge gate. Does not deploy Pages.
# Runs only from trusted events so a PR cannot rewrite this file and still merge.
# Trusted approvers: SkyyPlayz, SkyHigh-Mythos-Bot. cursor[bot] / Copilot never.
name: Site gate auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: site-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: site-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        !contains(github.event.comment.body, '<!-- site-gate-auto-merge -->')
      )
    steps:
      - name: Evaluate gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SITE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = '<!-- site-gate-auto-merge -->';
            const REQUIRED_CHECK = 'ci';
            const MERGE_LABEL = 'site-merge-ok';
            const TRUSTED = new Set(['SkyyPlayz', 'SkyHigh-Mythos-Bot']);
            const NEVER = new Set([
              'cursor[bot]',
              'Copilot',
              'copilot-pull-request-reviewer[bot]',
              'copilot-swe-agent[bot]',
            ]);

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function isTrusted(login) {
              if (!login || NEVER.has(login)) return false;
              return TRUSTED.has(login);
            }

            function isCiName(name) {
              return name === REQUIRED_CHECK || name === `CI / ${REQUIRED_CHECK}`;
            }

            async function resolvePullNumber() {
              if (context.payload.pull_request) return context.payload.pull_request.number;
              if (context.payload.issue?.pull_request) return context.payload.issue.number;
              if (context.eventName === 'workflow_run') {
                const sha = context.payload.workflow_run.head_sha;
                const headOwner = context.payload.workflow_run.head_repository.owner.login;
                const headBranch = context.payload.workflow_run.head_branch;
                const pulls = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${headOwner}:${headBranch}`,
                  per_page: 10,
                });
                const match = pulls.data.find((p) => p.head.sha === sha);
                return match ? match.number : null;
              }
              return null;
            }

            async function findMarkerComment(pullNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              return comments.find((c) => c.body && c.body.includes(MARKER)) || null;
            }

            async function upsertComment(pullNumber, body, { allowOverwriteSuccess = true } = {}) {
              const existing = await findMarkerComment(pullNumber);
              if (
                !allowOverwriteSuccess &&
                existing?.body &&
                existing.body.includes('**Site gate merged**')
              ) {
                core.info('Keeping existing merge success comment.');
                return;
              }
              const text = `${MARKER}\n${body}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: text,
                });
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: text,
              });
            }

            async function skip(pull, reason, silent) {
              core.info(reason);
              if (silent || !pull) return;
              await upsertComment(pull.number, `**Site gate skipped.** ${reason}`, {
                allowOverwriteSuccess: false,
              });
            }

            const pullNumber = await resolvePullNumber();
            if (!pullNumber) {
              core.info('No pull request for this event.');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (pull.merged || pull.state === 'closed') {
              core.info(`PR #${pull.number} is ${pull.merged ? 'merged' : 'closed'}; done.`);
              return;
            }

            if (pull.draft) {
              await skip(pull, 'Draft PRs are skipped.', true);
              return;
            }

            const author = pull.user?.login || '';
            if (author === 'dependabot[bot]' || author === 'dependabot') {
              await skip(pull, 'Dependabot PRs are skipped.', true);
              return;
            }

            if (pull.base?.ref !== 'main') {
              await skip(pull, `Base is \`${pull.base.ref}\`, not \`main\`.`);
              return;
            }

            const labels = (pull.labels || []).map((l) => l.name);
            if (!labels.includes(MERGE_LABEL)) {
              await skip(pull, `Needs label \`${MERGE_LABEL}\`.`);
              return;
            }

            const headSha = pull.head.sha;

            const checks = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: headSha,
              per_page: 100,
            });
            const ciOk = checks.data.check_runs.some(
              (r) =>
                isCiName(r.name) &&
                r.status === 'completed' &&
                r.conclusion === 'success',
            );
            if (!ciOk) {
              await skip(
                pull,
                `Required check \`${REQUIRED_CHECK}\` is not green on tip \`${headSha.slice(0, 7)}\`.`,
              );
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const latestDecision = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) continue;
              if (review.state === 'COMMENTED' || review.state === 'PENDING') continue;
              latestDecision.set(login, review);
            }

            const trustedOnTip = [];
            for (const [login, review] of latestDecision) {
              if (!isTrusted(login)) continue;
              if (review.state !== 'APPROVED') continue;
              if (review.commit_id && review.commit_id !== headSha) continue;
              trustedOnTip.push(login);
            }

            if (trustedOnTip.length < 1) {
              await skip(
                pull,
                'Need an approving review on this tip from `SkyyPlayz` or `SkyHigh-Mythos-Bot`. cursor[bot] and Copilot do not count.',
              );
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pull.number,
                merge_method: 'squash',
                sha: headSha,
              });
              await upsertComment(
                pull.number,
                `**Site gate merged** (squash) at \`${headSha.slice(0, 7)}\`. Approved by ${trustedOnTip.join(', ')}.`,
              );
            } catch (error) {
              const { data: again } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pull.number,
              });
              if (again.merged) {
                core.info('PR already merged; leaving success comment alone.');
                return;
              }
              await skip(pull, `Merge failed: ${error.message}`);
            }
