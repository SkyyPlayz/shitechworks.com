# Fail-closed site merge gate. Does not deploy Pages.
# Trusted approvers only: SkyyPlayz, SkyHigh-Mythos-Bot.
# cursor[bot] and Copilot are never merge authority.
name: Site gate auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: site-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: site-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    steps:
      - name: Evaluate gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SITE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = '<!-- site-gate-auto-merge -->';
            const REQUIRED_CHECK = 'ci';
            const MERGE_LABEL = 'site-merge-ok';
            const TRUSTED = new Set(['SkyyPlayz', 'SkyHigh-Mythos-Bot']);
            const NEVER = new Set([
              'cursor[bot]',
              'Copilot',
              'copilot-pull-request-reviewer[bot]',
              'copilot-swe-agent[bot]',
            ]);

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function isTrusted(login) {
              if (!login || NEVER.has(login)) return false;
              return TRUSTED.has(login);
            }

            function isCiName(name) {
              return name === REQUIRED_CHECK || name === `CI / ${REQUIRED_CHECK}`;
            }

            async function resolvePull() {
              if (context.payload.pull_request) return context.payload.pull_request;
              if (context.payload.issue?.pull_request) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: context.payload.issue.number,
                });
                return data;
              }
              if (context.eventName === 'workflow_run') {
                const sha = context.payload.workflow_run.head_sha;
                const pulls = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${context.payload.workflow_run.head_repository.owner.login}:${context.payload.workflow_run.head_branch}`,
                  per_page: 10,
                });
                const match = pulls.data.find((p) => p.head.sha === sha);
                if (match) {
                  const { data } = await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: match.number,
                  });
                  return data;
                }
              }
              return null;
            }

            async function upsertComment(pullNumber, body) {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              const text = `${MARKER}\n${body}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: text,
                });
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: text,
              });
            }

            async function skip(pull, reason, silent) {
              core.info(reason);
              if (silent || !pull) return;
              await upsertComment(pull.number, `**Site gate skipped.** ${reason}`);
            }

            const pull = await resolvePull();
            if (!pull) {
              core.info('No pull request for this event.');
              return;
            }

            if (pull.draft) {
              await skip(pull, 'Draft PRs are skipped.', true);
              return;
            }

            const author = pull.user?.login || '';
            if (author === 'dependabot[bot]' || author === 'dependabot') {
              await skip(pull, 'Dependabot PRs are skipped.', true);
              return;
            }

            if (pull.base?.ref !== 'main') {
              await skip(pull, `Base is \`${pull.base.ref}\`, not \`main\`.`);
              return;
            }

            const labels = (pull.labels || []).map((l) => l.name);
            if (!labels.includes(MERGE_LABEL)) {
              await skip(pull, `Needs label \`${MERGE_LABEL}\`.`);
              return;
            }

            const headSha = pull.head.sha;

            const checks = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: headSha,
              per_page: 100,
            });
            const ciRuns = checks.data.check_runs.filter((r) => isCiName(r.name));
            const ciOk = ciRuns.some(
              (r) => r.status === 'completed' && r.conclusion === 'success',
            );
            if (!ciOk) {
              await skip(
                pull,
                `Required check \`${REQUIRED_CHECK}\` is not green on tip \`${headSha.slice(0, 7)}\`.`,
              );
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const latestByUser = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) continue;
              latestByUser.set(login, review);
            }

            const trustedOnTip = [];
            for (const [login, review] of latestByUser) {
              if (!isTrusted(login)) continue;
              if (review.state !== 'APPROVED') continue;
              if (review.commit_id && review.commit_id !== headSha) continue;
              trustedOnTip.push(login);
            }

            if (trustedOnTip.length < 1) {
              await skip(
                pull,
                'Need an approving review on this tip from `SkyyPlayz` or `SkyHigh-Mythos-Bot`. cursor[bot] and Copilot do not count.',
              );
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pull.number,
                merge_method: 'squash',
                sha: headSha,
              });
              await upsertComment(
                pull.number,
                `**Site gate merged** (squash) at \`${headSha.slice(0, 7)}\`. Approved by ${trustedOnTip.join(', ')}.`,
              );
            } catch (error) {
              await skip(pull, `Merge failed: ${error.message}`);
            }
